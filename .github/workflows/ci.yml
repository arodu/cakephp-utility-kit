name: CI

on:
  push:
  pull_request:

jobs:
  testsuite:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, apcu, pdo_sqlite, sqlite3
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ matrix.php-version }}

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        env:
          DB_URL: 'sqlite:///:memory:'
        run: vendor/bin/phpunit

  cs:
    name: Coding Standard
    runs-on: ubuntu-latest
    # Informational: no bloquea el merge (el código de producción de 1.next
    # tiene deuda CS previa). El gate real de CI son los tests.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, apcu
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ matrix.php-version }}

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CodeSniffer
        run: composer cs-check
